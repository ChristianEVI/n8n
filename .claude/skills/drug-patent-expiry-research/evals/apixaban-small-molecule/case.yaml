expected_outcome: |
  Behandelt Apixaban (Eliquis, BMS/Pfizer) als Small Molecule: Orange-Book-Patente und Exklusivitaeten, US-Stoffpatent mit PTE und paediatrischer Exklusivitaet bis April 2028 sowie Settlements mit Generikaherstellern (Eintritt April 2028), EU-SPC-Ablauf 2026 und Stand der Nichtigkeitsverfahren bzw. Generikaeintritte in einzelnen EU-Laendern. Unterscheidet klar zwischen regulatorischer Exklusivitaet, Stoffpatent und Settlement-Datum.
